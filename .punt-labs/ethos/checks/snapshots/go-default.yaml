checks:
  full-gate:
    profile: linux-worktree-v1
    epoch: mcp-proxy-v1
    sources:
      mode: worktree
    network: loopback
    system:
      tools: [as, gcc, go, ld, make, node, npm, npx, ps, sh]
    runtime:
      platforms:
        linux-amd64:
          bundle: mcp-proxy-handoff-linux-amd64-1fad578f98cd92bf8af6b8a51825e7cde106ce5410c80aa8504e113ae024bdb4.tar.gz
          sha256: "1fad578f98cd92bf8af6b8a51825e7cde106ce5410c80aa8504e113ae024bdb4"
          path: ["{runtime}/go/bin", "{runtime}/node/bin"]
          env:
            CGO_ENABLED: "1"
            GOFLAGS: -modcacherw
            GOTOOLCHAIN: local
            GOPATH: "{scratch}/gopath"
            GOCACHE: "{scratch}/go-build"
            GOMODCACHE: "{scratch}/go-mod"
            GOPROXY: "file://{runtime}/cache/go-proxy"
            GOLANGCI_LINT_CACHE: "{scratch}/golangci-lint"
            npm_config_cache: "{scratch}/npm-cache"
            npm_config_offline: "true"
            VULNCHECK_DB: "file://{runtime}/vulndb"
    scratch:
      seed:
        "{scratch}/go-mod/cache/download": "{runtime}/cache/go-proxy"
        "{scratch}/npm-cache": "{runtime}/cache/npm"
    data:
      - path: "{runtime}/vulndb/index/db.json"
        max_age_hours: 72
