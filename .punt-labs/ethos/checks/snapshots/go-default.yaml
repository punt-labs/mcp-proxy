checks:
  full-gate:
    profile: linux-worktree-v1
    epoch: mcp-proxy-v1
    sources:
      mode: worktree
    network: loopback
    system:
      tools: [as, gcc, go, ld, make, node, npm, npx, ps, sh]
    runtime:
      platforms:
        linux-amd64:
          bundle: mcp-proxy-handoff-linux-amd64-cb066e3398e8b80e5eb8f7d6e5c796b888dd226f301fd745778e464d03420dba.tar.gz
          sha256: "cb066e3398e8b80e5eb8f7d6e5c796b888dd226f301fd745778e464d03420dba"
          path: ["{runtime}/go/bin", "{runtime}/node/bin"]
          env:
            CGO_ENABLED: "1"
            GOFLAGS: -modcacherw
            GOTOOLCHAIN: local
            GOPATH: "{scratch}/gopath"
            GOCACHE: "{scratch}/go-build"
            GOMODCACHE: "{scratch}/go-mod"
            GOPROXY: "file://{runtime}/cache/go-proxy"
            GOLANGCI_LINT_CACHE: "{scratch}/golangci-lint"
            npm_config_cache: "{scratch}/npm-cache"
            npm_config_offline: "true"
            VULNCHECK_DB: "file://{runtime}/data/govulndb"
    scratch:
      seed:
        "{scratch}/go-mod/cache/download": "{runtime}/cache/go-proxy"
        "{scratch}/npm-cache": "{runtime}/cache/npm"
    data:
      - name: govulndb
        url: https://vuln.go.dev
        max_age_hours: 24
        mount: govulndb
